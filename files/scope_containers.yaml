zabbix_export:
  version: '8.0'
  template_groups:

    # Responsible for Collecting: Scope Templates
    - uuid: 8ef96b18c230490a9a0a9e2307226339
      name: Scope Templates

  templates:

    - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300400
      template: Scope Containers
      name: Scope Containers
      description: |
        Podman container monitoring for the Containers requirement cluster.
        Implements OBS-F-084, 086, 088, 089, 090, 093 and the collection half
        of OBS-F-094.

        Collection: a single UserParameter (podman.status) runs
        /etc/zabbix/scripts/podman_status.sh once per interval and returns one
        JSON document for the whole host. Every other item is a dependent item
        derived from that document, so the host is queried once per minute
        regardless of how many containers are present.

        Why not native keys: Zabbix Agent 2 8.0 on RHEL 9 provides no
        Docker/Podman plugin (verified with `zabbix_agent2 -p`) and none is
        available as a package (`dnf search zabbix-agent2-plugin` returns
        ceph, ember-plus, mongodb, mssql, nvidia-gpu, postgresql only).
        Third-party binaries are excluded by CIS policy.

        Environment variation: on a host without Podman the script returns
        present=0 with empty arrays, discovery finds nothing, no item
        prototype is instantiated and no trigger fires.

# TEMPLATE GROUPS
# Categorizes the template in the Zabbix UI
      groups:

        - name: Scope Templates

# TEMPLATE MACROS
# Thresholds live here so a host can override them without editing the template
      macros:

        - macro: '{$PODMAN.CPU.WARN}'
          value: '80'
          description: 'OBS-TH-037 warning. Container CPU use as percent of one core.'

        - macro: '{$PODMAN.CPU.CRIT}'
          value: '95'
          description: 'OBS-TH-037 critical. Container CPU use as percent of one core.'

        - macro: '{$PODMAN.MEM.WARN}'
          value: '80'
          description: 'OBS-TH-037 warning. Container memory use as percent of its limit.'

        - macro: '{$PODMAN.MEM.CRIT}'
          value: '95'
          description: 'OBS-TH-037 critical. Container memory use as percent of its limit.'

# ITEMS (DATA COLLECTION)
# These define the exact metrics collected from the host.
# Only the first item touches the host; every other item is derived from it.
      items:

        # Responsible for Collecting: the single host-level JSON snapshot
        - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300401
          name: 'Podman: Host status (raw JSON)'
          type: ZABBIX_ACTIVE
          key: podman.status
          tags:

            - tag: requirement
              value: master
          value_type: TEXT
          delay: 1m
          history: 1d
          trends: '0'
          description: 'Master item. Output of podman_status.sh: present, runtime_ok, containers, stats, df.'

        # Responsible for Collecting: whether a container runtime exists on this host
        - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300402
          name: 'Podman: Runtime present'
          type: DEPENDENT
          key: podman.present
          tags:

            - tag: requirement
              value: OBS-F-084
          value_type: UNSIGNED
          master_item:
            key: podman.status

          preprocessing:

            - type: JSONPATH
              parameters:
                - $.present

        # Responsible for Collecting: [OBS-F-084] whether the runtime answers management operations
        - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300403
          name: 'Podman: Runtime responsive'
          type: DEPENDENT
          key: podman.runtime_ok
          tags:

            - tag: requirement
              value: OBS-F-084
          value_type: UNSIGNED
          master_item:
            key: podman.status

          description: '1 when `podman ps` returned valid JSON, 0 when the runtime did not respond.'
          preprocessing:

            - type: JSONPATH
              parameters:
                - $.runtime_ok

        # Responsible for Collecting: [OBS-F-086] total number of containers defined on the host
        - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300404
          name: 'Podman: Container count'
          type: DEPENDENT
          key: podman.containers.total
          tags:

            - tag: requirement
              value: OBS-F-086
          value_type: UNSIGNED
          master_item:
            key: podman.status

          preprocessing:

            - type: JSONPATH
              parameters:
                - $.containers.length()
              error_handler: CUSTOM_VALUE
              error_handler_params: '0'

        # Responsible for Collecting: [OBS-F-093] storage consumed by container images
        - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300405
          name: 'Podman: Image storage used'
          type: DEPENDENT
          key: podman.storage.images
          tags:

            - tag: requirement
              value: OBS-F-093
          value_type: UNSIGNED
          units: B
          master_item:
            key: podman.status

          preprocessing:

            - type: JSONPATH
              parameters:
                - $.df[?(@.Type=='Images')].RawSize.first()
              error_handler: DISCARD_VALUE

        # Responsible for Collecting: [OBS-F-093] storage consumed by container writable layers
        - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300406
          name: 'Podman: Container storage used'
          type: DEPENDENT
          key: podman.storage.containers
          tags:

            - tag: requirement
              value: OBS-F-093
          value_type: UNSIGNED
          units: B
          master_item:
            key: podman.status

          preprocessing:

            - type: JSONPATH
              parameters:
                - $.df[?(@.Type=='Containers')].RawSize.first()
              error_handler: DISCARD_VALUE

        # Responsible for Collecting: [OBS-F-093] storage consumed by persistent volumes
        - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300407
          name: 'Podman: Volume storage used'
          type: DEPENDENT
          key: podman.storage.volumes
          tags:

            - tag: requirement
              value: OBS-F-093
          value_type: UNSIGNED
          units: B
          master_item:
            key: podman.status

          preprocessing:

            - type: JSONPATH
              parameters:
                - $.df[?(@.Type=='Local Volumes')].RawSize.first()
              error_handler: DISCARD_VALUE

        # Responsible for Collecting: [OBS-F-093] bytes held by images and volumes no container uses
        - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300408
          name: 'Podman: Reclaimable storage (unassociated)'
          type: DEPENDENT
          key: podman.storage.reclaimable
          tags:

            - tag: requirement
              value: OBS-F-093
          value_type: UNSIGNED
          units: B
          master_item:
            key: podman.status

          description: 'Proxy for OBS-TH-041. Podman reports reclaimable bytes but not the age of orphaned items.'
          preprocessing:

            - type: JSONPATH
              parameters:
                - $.df[*].RawReclaimable.sum()
              error_handler: DISCARD_VALUE

# DISCOVERY RULES (LLD)
# Automatically detects resources like disks or containers dynamically.
# This rule is dependent, so discovery costs no extra call to the host.
      discovery_rules:

        # Responsible for Collecting: [OBS-F-086] the container inventory
        - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300430
          name: Podman Container Discovery
          type: DEPENDENT
          key: podman.container.discovery
          master_item:
            key: podman.status

          description: 'Discovers every container, running or not, from the ps section of the master item.'
          preprocessing:

            - type: JSONPATH
              parameters:
                - $.containers
              error_handler: DISCARD_VALUE
          lld_macro_paths:

            # Names is an ARRAY in podman ps output, hence the [0] index
            - lld_macro: '{#NAME}'
              path: $.Names[0]

            - lld_macro: '{#IMAGE}'
              path: $.Image

            - lld_macro: '{#ID}'
              path: $.Id

          item_prototypes:

            # Responsible for Collecting: [OBS-F-086] current lifecycle state of the container
            - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300431
              name: 'Container {#NAME}: State'
              type: DEPENDENT
              key: podman.container.state["{#NAME}"]
              tags:

                - tag: requirement
                  value: OBS-F-086
              value_type: CHAR
              master_item:
                key: podman.status

              preprocessing:

                - type: JSONPATH
                  parameters:
                    - $.containers[?(@.Names[0]=='{#NAME}')].State.first()
                  error_handler: DISCARD_VALUE

            # Responsible for Collecting: [OBS-F-086] image reference the container was created from
            - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300432
              name: 'Container {#NAME}: Image reference'
              type: DEPENDENT
              key: podman.container.image["{#NAME}"]
              tags:

                - tag: requirement
                  value: OBS-F-086
              value_type: CHAR
              master_item:
                key: podman.status

              preprocessing:

                - type: JSONPATH
                  parameters:
                    - $.containers[?(@.Names[0]=='{#NAME}')].Image.first()
                  error_handler: DISCARD_VALUE

                - type: DISCARD_UNCHANGED
                  parameters:
                    - ''

            # Responsible for Collecting: [OBS-F-088] whether the container is currently stopped
            - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300433
              name: 'Container {#NAME}: Exited'
              type: DEPENDENT
              key: podman.container.exited["{#NAME}"]
              tags:

                - tag: requirement
                  value: OBS-F-088
              value_type: CHAR
              master_item:
                key: podman.status

              preprocessing:

                - type: JSONPATH
                  parameters:
                    - $.containers[?(@.Names[0]=='{#NAME}')].Exited.first()
                  error_handler: DISCARD_VALUE

            # Responsible for Collecting: [OBS-F-088] exit status of the last run
            - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300434
              name: 'Container {#NAME}: Exit code'
              type: DEPENDENT
              key: podman.container.exitcode["{#NAME}"]
              tags:

                - tag: requirement
                  value: OBS-F-088

                - tag: requirement
                  value: OBS-F-090
              value_type: UNSIGNED
              master_item:
                key: podman.status

              preprocessing:

                - type: JSONPATH
                  parameters:
                    - $.containers[?(@.Names[0]=='{#NAME}')].ExitCode.first()
                  error_handler: DISCARD_VALUE

            # Responsible for Collecting: [OBS-F-088] start timestamp, which changes on every restart
            - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300435
              name: 'Container {#NAME}: Started at'
              type: DEPENDENT
              key: podman.container.startedat["{#NAME}"]
              tags:

                - tag: requirement
                  value: OBS-F-088
              value_type: UNSIGNED
              units: unixtime
              master_item:
                key: podman.status

              description: |
                Restart detection keys on this, not on podman's Restarts counter.
                Podman is daemonless: its restart policy is inactive without a
                supervising systemd unit, so Restarts stays at 0 through real
                crashes. The start timestamp changes whoever performed the start.
              preprocessing:

                - type: JSONPATH
                  parameters:
                    - $.containers[?(@.Names[0]=='{#NAME}')].StartedAt.first()
                  error_handler: DISCARD_VALUE

            # Responsible for Collecting: [OBS-F-094] networks the container is attached to
            - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300436
              name: 'Container {#NAME}: Network attachment'
              type: DEPENDENT
              key: podman.container.networks["{#NAME}"]
              tags:

                - tag: requirement
                  value: OBS-F-094
              value_type: TEXT
              master_item:
                key: podman.status

              preprocessing:

                - type: JSONPATH
                  parameters:
                    - $.containers[?(@.Names[0]=='{#NAME}')].Networks.first()
                  error_handler: DISCARD_VALUE

                - type: DISCARD_UNCHANGED
                  parameters:
                    - ''

            # Responsible for Collecting: [OBS-F-094] host ports published by the container
            - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300437
              name: 'Container {#NAME}: Published ports'
              type: DEPENDENT
              key: podman.container.ports["{#NAME}"]
              tags:

                - tag: requirement
                  value: OBS-F-094
              value_type: TEXT
              master_item:
                key: podman.status

              preprocessing:

                - type: JSONPATH
                  parameters:
                    - $.containers[?(@.Names[0]=='{#NAME}')].Ports.first()
                  error_handler: DISCARD_VALUE

                - type: DISCARD_UNCHANGED
                  parameters:
                    - ''

            # Responsible for Collecting: [OBS-F-089] CPU use, percent of one core
            - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300438
              name: 'Container {#NAME}: CPU utilisation'
              type: DEPENDENT
              key: podman.container.cpu["{#NAME}"]
              tags:

                - tag: requirement
                  value: OBS-F-089
              value_type: FLOAT
              units: '%'
              master_item:
                key: podman.status

              description: 'podman stats reports this as a formatted string such as "48.12%"; the regex step strips the suffix.'
              preprocessing:

                - type: JSONPATH
                  parameters:
                    - $.stats[?(@.name=='{#NAME}')].cpu_percent.first()
                  error_handler: DISCARD_VALUE

                - type: REGEX
                  parameters:
                    - '([0-9.]+)'
                    - \1
                  error_handler: DISCARD_VALUE

            # Responsible for Collecting: [OBS-F-089] memory use as a percentage of the container's limit
            - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300439
              name: 'Container {#NAME}: Memory utilisation against limit'
              type: DEPENDENT
              key: podman.container.mem["{#NAME}"]
              tags:

                - tag: requirement
                  value: OBS-F-089
              value_type: FLOAT
              units: '%'
              master_item:
                key: podman.status

              description: 'podman stats reports mem_percent against the configured memory limit, which is exactly what OBS-TH-037 asks for.'
              preprocessing:

                - type: JSONPATH
                  parameters:
                    - $.stats[?(@.name=='{#NAME}')].mem_percent.first()
                  error_handler: DISCARD_VALUE

                - type: REGEX
                  parameters:
                    - '([0-9.]+)'
                    - \1
                  error_handler: DISCARD_VALUE

          trigger_prototypes:

            # Responsible for Alerting: [OBS-F-090] container killed for exceeding its memory limit
            - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300450
              expression: last(/Scope Containers/podman.container.exitcode["{#NAME}"])=137
              name: '[OBS-F-090] HIGH: Container {#NAME} was terminated on its memory limit'
              priority: HIGH
              description: 'OBS-TH-039, any occurrence. Exit 137 is SIGKILL, the signal the kernel OOM killer sends.'

            # Responsible for Alerting: [OBS-F-088] container stopped with a non-zero exit status
            - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300451
              expression: last(/Scope Containers/podman.container.exited["{#NAME}"])="true" and last(/Scope Containers/podman.container.exitcode["{#NAME}"])>0
              name: '[OBS-F-088] WARNING: Container {#NAME} exited abnormally'
              priority: WARNING
              dependencies:

                - name: '[OBS-F-090] HIGH: Container {#NAME} was terminated on its memory limit'
                  expression: last(/Scope Containers/podman.container.exitcode["{#NAME}"])=137

            # Responsible for Alerting: [OBS-F-088] restart loop, critical rate
            - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300452
              expression: changecount(/Scope Containers/podman.container.startedat["{#NAME}"],10m)>=5
              name: '[OBS-F-088] HIGH: Container {#NAME} is in a restart loop (5 in 10m)'
              priority: HIGH
              description: 'OBS-TH-036 critical threshold.'

            # Responsible for Alerting: [OBS-F-088] restart loop, warning rate
            - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300453
              expression: changecount(/Scope Containers/podman.container.startedat["{#NAME}"],10m)>=3
              name: '[OBS-F-088] WARNING: Container {#NAME} is in a restart loop (3 in 10m)'
              priority: WARNING
              description: 'OBS-TH-036 warning threshold.'
              dependencies:

                - name: '[OBS-F-088] HIGH: Container {#NAME} is in a restart loop (5 in 10m)'
                  expression: changecount(/Scope Containers/podman.container.startedat["{#NAME}"],10m)>=5

            # Responsible for Alerting: [OBS-F-089] memory use against limit, critical
            - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300454
              expression: last(/Scope Containers/podman.container.mem["{#NAME}"])>={$PODMAN.MEM.CRIT}
              name: '[OBS-F-089] HIGH: Container {#NAME} memory use is at or above {$PODMAN.MEM.CRIT}% of its limit'
              priority: HIGH
              description: 'OBS-TH-037 critical threshold.'

            # Responsible for Alerting: [OBS-F-089] memory use against limit, warning
            - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300455
              expression: last(/Scope Containers/podman.container.mem["{#NAME}"])>={$PODMAN.MEM.WARN}
              name: '[OBS-F-089] WARNING: Container {#NAME} memory use is at or above {$PODMAN.MEM.WARN}% of its limit'
              priority: WARNING
              description: 'OBS-TH-037 warning threshold.'
              dependencies:

                - name: '[OBS-F-089] HIGH: Container {#NAME} memory use is at or above {$PODMAN.MEM.CRIT}% of its limit'
                  expression: last(/Scope Containers/podman.container.mem["{#NAME}"])>={$PODMAN.MEM.CRIT}

            # Responsible for Alerting: [OBS-F-089] CPU use, critical
            - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300456
              expression: last(/Scope Containers/podman.container.cpu["{#NAME}"])>={$PODMAN.CPU.CRIT}
              name: '[OBS-F-089] HIGH: Container {#NAME} CPU use is at or above {$PODMAN.CPU.CRIT}% of one core'
              priority: HIGH
              description: 'OBS-TH-037 critical threshold. Evaluated on the collected value; the threshold specifies no duration.'

            # Responsible for Alerting: [OBS-F-089] CPU use, warning
            - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300457
              expression: last(/Scope Containers/podman.container.cpu["{#NAME}"])>={$PODMAN.CPU.WARN}
              name: '[OBS-F-089] WARNING: Container {#NAME} CPU use is at or above {$PODMAN.CPU.WARN}% of one core'
              priority: WARNING
              description: 'OBS-TH-037 warning threshold. Evaluated on the collected value; the threshold specifies no duration.'
              dependencies:

                - name: '[OBS-F-089] HIGH: Container {#NAME} CPU use is at or above {$PODMAN.CPU.CRIT}% of one core'
                  expression: last(/Scope Containers/podman.container.cpu["{#NAME}"])>={$PODMAN.CPU.CRIT}

# TRIGGERS (TEMPLATE LEVEL)
# A trigger whose expression spans more than one item belongs at export top
# level, not inside the template. Single item triggers nest under their item.
  triggers:

    # Responsible for Alerting: [OBS-F-084] the container runtime stopped responding
    - uuid: c4f1a2b3d4e54f6a8b9c0d1e2f300420
      expression: last(/Scope Containers/podman.present)=1 and last(/Scope Containers/podman.runtime_ok)=0
      name: '[OBS-F-084] HIGH: Container runtime is not responding on {HOST.NAME}'
      priority: HIGH
      description: 'Podman is installed but did not answer a container management operation.'
