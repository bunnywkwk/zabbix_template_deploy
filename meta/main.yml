#SPDX-License-Identifier: MIT-0
galaxy_info:
  author: bunnywkwk
  description: Imports the 6 current requirement-cluster Zabbix templates into a Zabbix server via its HTTP API.

  license: MIT-0

  min_ansible_version: "2.14"

  galaxy_tags:
    - zabbix
    - monitoring
    - rhel

dependencies: []
  # No other Ansible roles required.
  #
  # This role does depend on the community.zabbix collection (for the
  # zabbix_template module used in tasks/main.yml) - that can't be
  # expressed here, since this `dependencies:` field only resolves other
  # Galaxy roles, not collections. The collection requirement is tracked
  # in the playbook-level requirements.yml instead (alongside
  # ansible.posix, needed by zabbix_agent_deploy), installed once via
  # `ansible-galaxy collection install -r requirements.yml` before
  # running any playbook in this project.
